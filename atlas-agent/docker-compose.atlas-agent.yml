services:
  atlas-agent:
    build: ./atlas-agent
    container_name: atlas_agent
    restart: unless-stopped
    environment:
      ATLAS_URL: ${ATLAS_URL}
      ATLAS_API_KEY: ${ATLAS_API_KEY}
      ATLAS_PROJECT_ID: ${ATLAS_PROJECT_ID}
      ATLAS_AGENT_NAME: ${ATLAS_AGENT_NAME:-atlas-agent}
      ATLAS_LOG_FILES: ${ATLAS_LOG_FILES:-}
      ATLAS_ACCESS_LOG: ${ATLAS_ACCESS_LOG:-/var/log/nginx/access.log}
    volumes:
      - ./storage/logs:/var/log/app:ro
      - /var/log/nginx:/var/log/nginx:ro
