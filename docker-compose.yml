services:
  nginx:
    image: nginx:alpine
    container_name: oblok_nginx
    ports:
      - "${FORWARD_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - oblok_network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: oblok_app
    volumes:
      - .:/var/www/html
    environment:
      CONTAINER_ROLE: app
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-oblok}
      DB_USERNAME: ${DB_USERNAME:-oblok}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    networks:
      - oblok_network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: oblok_worker
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    environment:
      CONTAINER_ROLE: worker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-oblok}
      DB_USERNAME: ${DB_USERNAME:-oblok}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - oblok_network
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: oblok_scheduler
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment:
      CONTAINER_ROLE: scheduler
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-oblok}
      DB_USERNAME: ${DB_USERNAME:-oblok}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - oblok_network
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: oblok_reverb
    command: >
      sh -c "php artisan package:discover --ansi &&
             php artisan reverb:start --host=0.0.0.0 --port=8080"
    volumes:
      - .:/var/www/html
    environment:
      CONTAINER_ROLE: reverb
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-oblok}
      DB_USERNAME: ${DB_USERNAME:-oblok}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - oblok_network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: oblok_postgres
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-oblok}
      POSTGRES_USER: ${DB_USERNAME:-oblok}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oblok_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: oblok_redis
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - oblok_network
    restart: unless-stopped

networks:
  oblok_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
