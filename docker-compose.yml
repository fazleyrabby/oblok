services:
  nginx:
    image: nginx:alpine
    container_name: atlas_nginx
    ports:
      - "${FORWARD_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - atlas_network

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: atlas_app
    volumes:
      - .:/var/www/html
    environment:
      CONTAINER_ROLE: app
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-atlas}
      DB_USERNAME: ${DB_USERNAME:-atlas}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    networks:
      - atlas_network

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: atlas_worker
    command: php artisan queue:work redis --queue=monitoring,notifications,default,low --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
    environment:
      CONTAINER_ROLE: worker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-atlas}
      DB_USERNAME: ${DB_USERNAME:-atlas}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - atlas_network

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: atlas_scheduler
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment:
      CONTAINER_ROLE: scheduler
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-atlas}
      DB_USERNAME: ${DB_USERNAME:-atlas}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - atlas_network

  postgres:
    image: postgres:16-alpine
    container_name: atlas_postgres
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-atlas}
      POSTGRES_USER: ${DB_USERNAME:-atlas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atlas_network

  redis:
    image: redis:7-alpine
    container_name: atlas_redis
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - atlas_network

networks:
  atlas_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
